<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Presentes</title>
  <meta name="description" content="Minha lista de presentes de aniversário">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf7f2;
      --surface: #ffffff;
      --ink: #1f1b16;
      --muted: #6f665c;
      --line: #e9e2d7;
      --accent: #c2410c;
      --accent-ink: #ffffff;
      --chip: #f3ede4;
      --shadow: 0 1px 2px rgba(31,27,22,.05), 0 8px 24px rgba(31,27,22,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16130f;
        --surface: #201c17;
        --ink: #f3ede4;
        --muted: #a89e92;
        --line: #332d26;
        --accent: #fb923c;
        --accent-ink: #1f1b16;
        --chip: #2a251f;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.5;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

    header.top {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      position: sticky; top: 0; z-index: 5;
    }
    header.top .wrap {
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
    }
    .brand { font-family: Fraunces, serif; font-weight: 700; font-size: 1.25rem; letter-spacing: -.01em; }
    .brand span { color: var(--accent); }
    .count { font-size: .875rem; color: var(--muted); }

    .hero { padding: 56px 0 32px; }
    .hero h1 {
      font-family: Fraunces, serif; font-weight: 500;
      font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.1;
      margin: 0 0 12px; letter-spacing: -.02em; max-width: 18ch;
    }
    .hero p { margin: 0; color: var(--muted); max-width: 56ch; font-size: 1.05rem; }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 24px; }
    .filters button {
      font: inherit; font-size: .875rem; font-weight: 500;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      padding: 8px 14px; border-radius: 999px; cursor: pointer;
    }
    .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .grid {
      display: grid; gap: 24px;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      padding-bottom: 64px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: var(--shadow); transition: transform .2s ease;
    }
    .card:hover { transform: translateY(-3px); }
    .card .media { aspect-ratio: 4 / 5; background: #f1ede7; overflow: hidden; }
    .card .media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
    .card:hover .media img { transform: scale(1.04); }
    .card .body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { font-size: .75rem; font-weight: 600; background: var(--chip); color: var(--muted); padding: 3px 9px; border-radius: 999px; }
    .card h2 { font-size: 1rem; font-weight: 600; margin: 0; line-height: 1.35; }
    .card .cor { font-size: .85rem; color: var(--muted); margin: 0; }
    .card .desc { font-size: .875rem; color: var(--muted); margin: 0; }
    .price { font-family: Fraunces, serif; font-size: 1.35rem; font-weight: 700; margin-top: auto; padding-top: 4px; }
    .price small { display: block; font-family: Inter, sans-serif; font-size: .7rem; font-weight: 400; color: var(--muted); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent); color: var(--accent-ink); text-decoration: none;
      font-weight: 600; font-size: .9rem; padding: 12px 16px; border-radius: 10px;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:focus-visible, .filters button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: .85rem; text-align: center; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">Lista de Presentes<span>.</span></div>
      <div class="count" id="count"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Ideias de presente para o meu aniversário 🎂</h1>
      <p>Separei aqui algumas coisas que eu adoraria ganhar. Clique em “Ver na loja” para ir direto à página oficial do produto.</p>
    </section>

    <nav class="filters" id="filters" aria-label="Filtrar por categoria"></nav>
    <section class="grid" id="grid"></section>
  </main>

  <footer>Feito com carinho · os preços são apenas referência e podem mudar na loja.</footer>

  <script src="produtos.js"></script>
  <script>
    const grid = document.getElementById("grid");
    const filters = document.getElementById("filters");
    const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function render(cat) {
      const lista = cat === "Todos" ? PRODUTOS : PRODUTOS.filter(p => p.categoria === cat);
      grid.innerHTML = lista.map(p => `
        <article class="card">
          <div class="media"><img src="${esc(p.imagem)}" alt="${esc(p.nome)}" loading="lazy"></div>
          <div class="body">
            <div class="meta"><span class="chip">${esc(p.loja)}</span><span class="chip">${esc(p.categoria)}</span></div>
            <h2>${esc(p.nome)}</h2>
            ${p.cor ? `<p class="cor">Cor: ${esc(p.cor)}</p>` : ""}
            <p class="desc">${esc(p.descricao)}</p>
            ${p.preco ? `<div class="price"><small>preço de referência</small>${brl.format(p.preco)}</div>` : ""}
            <a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">Ver na loja ↗</a>
          </div>
        </article>`).join("");
      document.getElementById("count").textContent = `${PRODUTOS.length} ${PRODUTOS.length === 1 ? "item" : "itens"}`;
      filters.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === cat));
    }

    const cats = ["Todos", ...new Set(PRODUTOS.map(p => p.categoria))];
    filters.innerHTML = cats.map(c => `<button type="button" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
    filters.addEventListener("click", e => { const b = e.target.closest("button"); if (b) render(b.dataset.cat); });
    render("Todos");
  </script>
</body>
</html>
